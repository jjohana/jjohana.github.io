<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advancy Preliminary Views</title>
    <style>
      :root {
        --navy: #003057;
        --blue: #699fc0;
        --orange: #f37f37;
        --green: #4f9f78;
        --ink: #222221;
        --muted: #626262;
        --line: #deded7;
        --paper: #fbfbf8;
        --pale: #f3f6f7;
        --white: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        background: var(--navy);
        color: var(--white);
        padding: 34px 56px 30px;
        border-bottom: 8px solid var(--orange);
      }

      .brand {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
        color: #dceaf1;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: clamp(32px, 5vw, 54px);
        line-height: 1;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        max-width: 820px;
        color: #e6eef3;
        font-size: 17px;
        line-height: 1.35;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 34px 28px 56px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 420px) 1fr;
        gap: 28px;
        align-items: start;
      }

      section {
        min-width: 0;
      }

      .panel {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 22px;
      }

      h2 {
        margin: 0 0 18px;
        color: var(--navy);
        font-size: 22px;
        line-height: 1.15;
      }

      label {
        display: block;
        margin: 16px 0 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      input,
      select {
        width: 100%;
        height: 44px;
        border: 1px solid #cfcfca;
        border-radius: 6px;
        padding: 0 12px;
        background: #fff;
        color: var(--ink);
        font-size: 15px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        padding: 0 18px;
        background: var(--orange);
        color: var(--white);
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .secondary {
        background: var(--navy);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .status-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .status-kpi {
        min-width: 122px;
        padding: 10px 12px;
        background: var(--pale);
        border-left: 6px solid var(--blue);
      }

      .status-kpi strong {
        display: block;
        color: var(--navy);
        font-size: 24px;
        line-height: 1;
      }

      .status-kpi span {
        color: var(--muted);
        font-size: 12px;
      }

      .bar {
        height: 10px;
        background: #e8e8e2;
        border-radius: 99px;
        overflow: hidden;
        margin: 10px 0 18px;
      }

      .bar > div {
        height: 100%;
        width: 0;
        background: var(--orange);
        transition: width 300ms ease;
      }

      .steps {
        display: grid;
        gap: 8px;
      }

      .step {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #e8e8e2;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 99px;
        background: #c8c8c3;
      }

      .step.completed .dot {
        background: var(--green);
      }

      .step.running .dot {
        background: var(--orange);
      }

      .step.failed .dot {
        background: #bf4b3f;
      }

      .step-title {
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
      }

      .step-detail {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .duration {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .previews {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 20px;
      }

      .previews img {
        display: block;
        width: 100%;
        border: 1px solid var(--line);
        background: var(--white);
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .error {
        color: #9a2f24;
        font-weight: 700;
      }

      @media (max-width: 860px) {
        header {
          padding: 28px 24px;
        }

        main {
          padding: 24px 18px 42px;
        }

        .workspace,
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Advancy preliminary views</div>
      <h1>Client-facing deck generator</h1>
      <p class="subtitle">Rich workflow with public-source research, structured artifacts, SVG exhibits, PowerPoint export, and live step feedback.</p>
    </header>

    <main>
      <div class="workspace">
        <section class="panel">
          <h2>New presentation</h2>
          <form id="deck-form">
            <label for="company">Company</label>
            <input id="company" name="company" value="Roche" autocomplete="organization" required />

            <label for="sector">Sector</label>
            <input id="sector" name="sector" value="pharmaceuticals and diagnostics" required />

            <div class="row">
              <div>
                <label for="slides">Slides</label>
                <input id="slides" name="slides" type="number" min="2" max="60" value="30" />
              </div>
              <div>
                <label for="reasoning">Reasoning</label>
                <select id="reasoning" name="reasoning">
                  <option value="medium" selected>medium</option>
                  <option value="high">high</option>
                  <option value="low">low</option>
                </select>
              </div>
            </div>

            <label for="api">Backend endpoint</label>
            <input id="api" name="api" value="https://advancy-deck-mcp.onrender.com" />

            <div class="actions">
              <button id="submit" type="submit">Generate deck</button>
              <button id="latest" type="button" class="secondary">Load latest</button>
              <a id="mcp-link" class="button secondary" href="#" target="_blank" rel="noreferrer">MCP endpoint</a>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="status-head">
            <div>
              <h2 id="status-title">Workflow feedback</h2>
              <div id="status-detail" class="muted">No run started.</div>
            </div>
            <div class="status-kpi">
              <strong id="progress">0%</strong>
              <span id="elapsed">elapsed 0s</span>
            </div>
          </div>

          <div class="bar"><div id="bar"></div></div>
          <div id="steps" class="steps"></div>
          <div id="outputs" class="actions"></div>
          <div id="previews" class="previews"></div>
        </section>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const defaultApi = params.get("api") || localStorage.getItem("advancyApiBase") || "https://advancy-deck-mcp.onrender.com";
      const form = document.getElementById("deck-form");
      const apiInput = document.getElementById("api");
      const submit = document.getElementById("submit");
      const latest = document.getElementById("latest");
      const mcpLink = document.getElementById("mcp-link");
      const statusTitle = document.getElementById("status-title");
      const statusDetail = document.getElementById("status-detail");
      const progress = document.getElementById("progress");
      const elapsed = document.getElementById("elapsed");
      const bar = document.getElementById("bar");
      const steps = document.getElementById("steps");
      const outputs = document.getElementById("outputs");
      const previews = document.getElementById("previews");
      let pollTimer = null;

      apiInput.value = defaultApi.replace(/\/$/, "");
      updateMcpLink();
      apiInput.addEventListener("input", updateMcpLink);

      function apiBase() {
        return apiInput.value.trim().replace(/\/$/, "");
      }

      function updateMcpLink() {
        const base = apiBase();
        localStorage.setItem("advancyApiBase", base);
        mcpLink.href = base ? `${base}/mcp` : "#";
      }

      function seconds(value) {
        const n = Number(value || 0);
        if (n < 60) return `${Math.round(n)}s`;
        const m = Math.floor(n / 60);
        const s = Math.round(n % 60);
        return `${m}m ${String(s).padStart(2, "0")}s`;
      }

      function renderStatus(data) {
        const pct = Math.round(Number(data.progress_percent || 0));
        statusTitle.textContent = data.company ? `${data.company} workflow` : "Workflow feedback";
        statusDetail.textContent = data.last_detail || data.status || "Queued.";
        progress.textContent = `${pct}%`;
        elapsed.textContent = `elapsed ${seconds(data.elapsed_seconds || data.duration_seconds || 0)}`;
        bar.style.width = `${pct}%`;
        steps.innerHTML = "";
        outputs.innerHTML = "";
        previews.innerHTML = "";

        const workflowSteps = Array.isArray(data.steps) ? data.steps : [];
        for (const step of workflowSteps) {
          const node = document.createElement("div");
          node.className = `step ${step.status || ""}`;
          node.innerHTML = `
            <div class="dot"></div>
            <div>
              <div class="step-title">${escapeHtml(step.title || step.id || "")}</div>
              <div class="step-detail">${escapeHtml(step.detail || "")}</div>
            </div>
            <div class="duration">${escapeHtml(seconds(step.duration_seconds || step.elapsed_seconds || 0))}</div>
          `;
          steps.appendChild(node);
        }

        if (data.download_url) {
          const link = document.createElement("a");
          link.className = "button";
          link.href = data.download_url;
          link.textContent = "Download PPTX";
          outputs.appendChild(link);
        }

        if (data.contact_sheet_url) {
          const link = document.createElement("a");
          link.className = "button secondary";
          link.href = data.contact_sheet_url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = "Contact sheet";
          outputs.appendChild(link);
        }

        const previewUrls = Array.isArray(data.preview_urls) ? data.preview_urls.slice(0, 6) : [];
        for (const url of previewUrls) {
          const image = document.createElement("img");
          image.src = url;
          image.alt = "Slide preview";
          previews.appendChild(image);
        }
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function poll(statusUrl) {
        const response = await fetch(statusUrl);
        const data = await response.json();
        renderStatus(data);
        if (data.status === "completed" || data.status === "failed") {
          submit.disabled = false;
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearInterval(pollTimer);
        pollTimer = null;
        updateMcpLink();
        submit.disabled = true;
        steps.innerHTML = "";
        outputs.innerHTML = "";
        previews.innerHTML = "";
        statusDetail.textContent = "Starting workflow.";

        const payload = {
          company: document.getElementById("company").value.trim(),
          sector: document.getElementById("sector").value.trim(),
          slide_count: Number(document.getElementById("slides").value || 30),
          reasoning: document.getElementById("reasoning").value,
          model: "gpt-5.5",
          workflow: "rich",
          render_engine: "artifact",
          enable_web_search: true
        };

        try {
          const response = await fetch(`${apiBase()}/api/decks`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || response.statusText);
          renderStatus(data);
          pollTimer = setInterval(() => poll(data.status_url).catch(showError), 3000);
          await poll(data.status_url);
        } catch (error) {
          showError(error);
        }
      });

      latest.addEventListener("click", async () => {
        clearInterval(pollTimer);
        pollTimer = null;
        updateMcpLink();
        statusDetail.textContent = "Loading latest workflow.";
        try {
          const response = await fetch(`${apiBase()}/api/decks?limit=1`);
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || response.statusText);
          if (!Array.isArray(data) || !data.length) throw new Error("No completed workflow is available yet.");
          renderStatus(data[0]);
        } catch (error) {
          showError(error);
        }
      });

      function showError(error) {
        submit.disabled = false;
        statusDetail.innerHTML = `<span class="error">${escapeHtml(error.message || String(error))}</span>`;
      }
    </script>
  </body>
</html>
